[workspace]
resolver = "3"
members = ["backend", "platform/core", "plugins/*/api", "plugins/*/backend"]

[workspace.package]
version = "0.1.0"
edition = "2024"
publish = false

[workspace.dependencies]
arena-platform = { path = "platform/core" }

api-auth = { path = "plugins/auth/api" }
api-board = { path = "plugins/board/api" }
api-fight = { path = "plugins/fight/api" }
api-journal = { path = "plugins/journal/api" }
api-kolexplorer = { path = "plugins/kolexplorer/api" }
api-registry = { path = "plugins/registry/api" }
api-roster = { path = "plugins/roster/api" }
api-schedule = { path = "plugins/schedule/api" }
api-score = { path = "plugins/score/api" }
api-snapshots = { path = "plugins/snapshots/api" }
api-solanatracker = { path = "plugins/solanatracker/api" }
api-wallets = { path = "plugins/wallets/api" }

plugin-auth = { path = "plugins/auth/backend" }
plugin-board = { path = "plugins/board/backend" }
plugin-duel = { path = "plugins/duel/backend" }
plugin-fight = { path = "plugins/fight/backend" }
plugin-fomo = { path = "plugins/fomo/backend" }
plugin-guess = { path = "plugins/guess/backend" }
plugin-journal = { path = "plugins/journal/backend" }
plugin-kolexplorer = { path = "plugins/kolexplorer/backend" }
plugin-moves = { path = "plugins/moves/backend" }
plugin-network = { path = "plugins/network/backend" }
plugin-picker = { path = "plugins/picker/backend" }
plugin-radar = { path = "plugins/radar/backend" }
plugin-registry = { path = "plugins/registry/backend" }
plugin-roster = { path = "plugins/roster/backend" }
plugin-schedule = { path = "plugins/schedule/backend" }
plugin-score = { path = "plugins/score/backend" }
plugin-snapshots = { path = "plugins/snapshots/backend" }
plugin-solanatracker = { path = "plugins/solanatracker/backend" }
plugin-streaks = { path = "plugins/streaks/backend" }
plugin-tournament = { path = "plugins/tournament/backend" }
plugin-wallets = { path = "plugins/wallets/backend" }

async-trait = "0.1"
axum = "0.8"
chrono = { version = "0.4", default-features = false, features = ["clock", "serde", "std"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sqlx = { version = "0.8", default-features = false, features = ["runtime-tokio", "postgres", "migrate", "macros", "chrono", "json"] }
thiserror = "2"
tokio = { version = "1", features = ["macros", "rt-multi-thread", "net", "time", "sync"] }
toml = "0.8"
tower = { version = "0.5", features = ["util"] }
tower-http = { version = "0.6", features = ["fs"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", default-features = false, features = ["fmt", "ansi", "env-filter"] }
